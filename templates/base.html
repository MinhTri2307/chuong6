<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quản lý sinh viên{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; }
        header { background: #1f3a93; color: #fff; padding: 14px 24px; }
        header a { color: #fff; text-decoration: none; margin-right: 16px; }
        main { max-width: 800px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #1f3a93; color: #fff; }
        .low { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('student_list') }}">Danh sách sinh viên</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
